<div class="backgound">
  <mat-grid-list cols="1" rowHeight="80%">
    <mat-grid-tile>
      <mat-card class="card-content">
        <mat-card-content>
          <button mat-fab extended (click)="goToBrilGevonden()">
            <mat-icon>arrow_right_alt</mat-icon>
            Bril gevonden?
          </button>
          <div class="divider"></div>
          <button mat-fab extended class="button" (click)="goToGevondenBrillen()">
            <mat-icon>arrow_right_alt</mat-icon>
            Bril kwijt?
          </button>
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
