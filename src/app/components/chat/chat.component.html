<link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
/>
<div class="component">
    <div class="container-fluid">
        <div class="row justify-content-center h-100">
            <div class="card-footer"></div>
        </div>
    </div>
    <div class="chat">
        <div class="card">
            <div class="card-header msg_head">
                <div class="user_info">
                    <span>{{this.channelName}}</span>
                </div>
            </div>
            <div id="chat" class="card-body msg_card_body">
                <!--messages - start> -->
                <div *ngFor="let msg of currentMessages | async">
                    <div
                            *ngIf="msg.sender === otherUser!.customerName; else thisUserMsg"
                            class="d-flex justify-content-start mb-4"
                    >
                        <div class="msg_cotainer">
                            {{ msg.content }}
                            <span class="msg_time">{{
                                    whenWasItPublished(msg.t_stamp)
                                }}</span>
                        </div>
                    </div>

                    <ng-template #thisUserMsg>
                        <div class="d-flex justify-content-end mb-4">
                            <div class="msg_cotainer_send">
                                {{ msg.content }}
                                <span class="msg_time_send">{{
                                        whenWasItPublished(msg.t_stamp)
                                    }}</span>
                            </div>
                        </div>
                    </ng-template>
                </div>
                <!--messages - end-->
            </div>
            <div class="card-footer">
                <div class="input-group">
                    <div class="input-group-append">
                        <span class="attach_btn"><i class="fas fa-paperclip"></i></span>
                    </div>
                    <textarea
                            [formControl]="newMessage"
                            name=""
                            class="type_msg"
                            placeholder="Type your message..."
                    ></textarea>
                    <div class="input-group-append">
            <span (click)="sendMsg()" class="send_btn"
            ><i class="material-icons" style="font-size: 36px">send</i
            ></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
