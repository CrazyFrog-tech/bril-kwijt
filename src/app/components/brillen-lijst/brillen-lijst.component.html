<app-loading-spinner *ngIf="(isLoadingBrillen | async); else notLoading"></app-loading-spinner>
<ng-template #notLoading>
    <mat-nav-list class="container" *ngFor="let item of brilListItems" role="list">
        <app-bril-list-item [brilListItem]="item"></app-bril-list-item>
    </mat-nav-list>
</ng-template>
