<app-loading-spinner *ngIf="displayProgressSpinner; else notLoading"></app-loading-spinner>
<ng-template #notLoading>
    <div class="background">
        <div class="container">
            <div class="card">
                <mat-form-field class="inputField" appearance="outline">
                    <mat-label>Titel</mat-label>
                    <div [formGroup]="brilDetails">
                        <input
                                type="text"
                                matInput
                                placeholder="Titel"
                                formControlName="titel"
                        />
                    </div>
                    <mat-hint>Hint</mat-hint>
                </mat-form-field>
                <mat-form-field>
                    <mat-label>Choose a date</mat-label>
                    <div [formGroup]="brilDetails">
                        <input matInput formControlName="lostAt" [matDatepicker]="picker"/>
                    </div>
                    <mat-hint>MM/DD/YYYY</mat-hint>
                    <mat-datepicker-toggle
                            matIconSuffix
                            [for]="picker"
                    ></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
                <app-address-from-component
                        (addressEmitted)="handleAddress($event)"
                ></app-address-from-component>
                <mat-label>Beschrijving</mat-label>
                <mat-form-field>
                    <div [formGroup]="brilDetails">
                        <input
                                type="text"
                                matInput
                                placeholder="Beschrijving"
                                formControlName="description"
                        />
                    </div>
                </mat-form-field>
                <mat-form-field>
                    <div [formGroup]="brilDetails">
                        <input
                                type="text"
                                matInput
                                placeholder="Color"
                                formControlName="color"
                        />
                    </div>
                </mat-form-field>
                <mat-form-field>
                    <div [formGroup]="brilDetails">
                        <input
                                type="text"
                                matInput
                                placeholder="Brand(optional)"
                                formControlName="brand"
                        />
                    </div>
                </mat-form-field>
                <div class="container">
                    <app-upload-images
                            (change)="getSelectedFiles($event)"
                    ></app-upload-images>
                </div>
                <button mat-flat-button type="submit" color="primary" (click)="uploadAndGoHome()">
                    Upload
                </button>
            </div>
        </div>
    </div>
</ng-template>
