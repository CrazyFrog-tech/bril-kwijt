<mat-card *ngIf="bril">
  <img mat-card-image src="bril.imageConent" alt="Glasses">
  <mat-card-header>
    <div mat-card-avatar><mat-icon>face</mat-icon></div>
    <mat-card-title>{{bril.titel}}</mat-card-title>
    <mat-card-subtitle>Scientist</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>A brilliant scientist who wears glasses.</p>
  </mat-card-content>
</mat-card>
