<mat-list-item (click)="onListItemClicked()">
  <img
    [src]="brilListItem.imageContent"
    alt="Image"
  >
  <h3 matListItemTitle>{{ brilListItem.name }}</h3>
  <p matListItemLine>
    <span> {{ brilListItem.name}} </span>
    <span class="demo-2"> -- {{ brilListItem.name }} </span>
  </p>
</mat-list-item>
