<div class="profile-container">
    <h2>Profile</h2>
    <ul *ngIf="(auth.user$ | async) as user">
        <li><strong>Email:</strong> {{ user.email }}</li>
    </ul>
    <button class="button" mat-fab extended (click)="logout()">Logout</button>
    <button class="button" mat-fab extended (click)="goToHomePage()">Go to Home Page</button>
</div>
